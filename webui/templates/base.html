<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ai-crypto-bot{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand"><span class="dot"></span> ai-crypto-bot</div>
      <nav class="sidenav">
        <a href="/overview" class="{{ 'active' if active == 'overview' }}">Özet</a>
        <a href="/pairs" class="{{ 'active' if active == 'pairs' }}">Grafik</a>
        <a href="/trades" class="{{ 'active' if active == 'trades' }}">İşlemler</a>
        <a href="/system" class="{{ 'active' if active == 'system' }}">Sistem</a>
      </nav>
      <div class="sidebar-footer">
        <span class="live-dot {{ 'on' if live.ws_connected }}" title="{{ 'Canlı akış bağlı' if live.ws_connected else 'Canlı akış kopuk' }}"></span>
        <span>Canlı akış</span>
      </div>
    </aside>

    <div class="main">
      <header class="header">
        <div class="header-title">{% block page_title %}Özet{% endblock %}</div>
      </header>
      <div class="container">
        {% if not live.connected %}
        <div class="banner">⚠ Freqtrade botuna ulaşılamıyor ({{ live.last_error or 'bağlantı yok' }}). Veriler eski olabilir.</div>
        {% endif %}
        {% block content %}{% endblock %}
      </div>
    </div>
  </div>
  <script src="/static/js/live.js"></script>
</body>
</html>
