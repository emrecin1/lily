{% extends "base.html" %}
{% block title %}İşlemler — Lily{% endblock %}
{% block page_title %}İşlemler{% endblock %}
{% block content %}

<div id="trades-content">
  {% include "partials/trades_fragment.html" %}
</div>

<script>
document.addEventListener("webui:event", function (e) {
  var t = e.detail && e.detail.type;
  var live = ["entry", "entry_fill", "entry_cancel", "exit", "exit_fill", "exit_cancel", "status", "new_candle"];
  if (t && live.indexOf(t) !== -1) {
    fetch("/trades/fragment?page={{ page }}&date_from={{ date_from }}&date_to={{ date_to }}").then(function (r) { return r.text(); }).then(function (html) {
      document.getElementById("trades-content").innerHTML = html;
    });
  }
});
</script>

{% endblock %}
