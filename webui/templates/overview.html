{% extends "base.html" %}
{% block title %}Özet — ai-crypto-bot{% endblock %}
{% block page_title %}Özet{% endblock %}
{% block content %}

<div id="overview-content">
  {% include "partials/overview_fragment.html" %}
</div>

<script>
document.addEventListener("webui:event", function (e) {
  var t = e.detail && e.detail.type;
  var live = ["entry", "entry_fill", "entry_cancel", "exit", "exit_fill", "exit_cancel", "status", "new_candle"];
  if (t && live.indexOf(t) !== -1) {
    fetch("/overview/fragment").then(function (r) { return r.text(); }).then(function (html) {
      document.getElementById("overview-content").innerHTML = html;
    });
  }
});
</script>

{% endblock %}
