<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Giriş — ai-crypto-bot</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <h1><span class="dot" style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);"></span> ai-crypto-bot</h1>
      <p class="sub">Panele giriş yap</p>
      {% if error %}<div class="error">{{ error }}</div>{% endif %}
      <form method="post" action="/login">
        <input type="hidden" name="next" value="{{ next or '/overview' }}">
        <input type="password" name="password" placeholder="Şifre" autofocus required>
        <button type="submit">Giriş</button>
      </form>
    </div>
  </div>
</body>
</html>
